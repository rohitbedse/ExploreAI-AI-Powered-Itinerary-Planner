# Run via `make dev` (adds --env-file .env). Build context is the repo root.
name: exploreai

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exploreai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exploreai}
      POSTGRES_DB: ${POSTGRES_DB:-exploreai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exploreai} -d ${POSTGRES_DB:-exploreai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      # Override host-based URLs from .env with in-network service names.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-exploreai}:${POSTGRES_PASSWORD:-exploreai}@postgres:5432/${POSTGRES_DB:-exploreai}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../apps/api/app:/app/app

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file: ../.env
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web/src:/repo/apps/web/src

volumes:
  pgdata:
